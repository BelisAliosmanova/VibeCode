<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:fragment="favicons">
        <link rel="icon" th:href="@{/favico-b.svg}" type="image/svg+xml" media="(prefers-color-scheme: light)"/>
        <link rel="icon" th:href="@{/favico-w.svg}" type="image/svg+xml" media="(prefers-color-scheme: dark)"/>
        <link rel="alternate icon" th:href="@{/favicon.ico}"/>
    </th:block>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Log in — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:           #1a2332;
            --card-bg:      #1e2a3a;
            --border:       rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --white:        #ffffff;
            --gray-200:     #b0b8c4;
            --gray-300:     #7a8494;
            --cyan:         #00d4ff;
            --accent-green: rgba(143,230,4,1);
            --radius-md:    10px;
            --radius-pill:  999px;
            --font: 'Sora', sans-serif;
        }
        * { font-family: var(--font); }
        body {
            background: #233141;
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2.25rem 2rem;
            margin: 1rem;
        }
        .auth-logo {
            width: 36px; height: 36px; border-radius: 50%;
            background: #fff; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; font-weight: 700; color: #1a2332;
        }
        h1 {
            font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 0.4rem;
        }
        .subtitle {
            text-align: center; color: var(--gray-300); font-size: 0.85rem; margin-bottom: 1.75rem;
        }
        .field { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.8rem; color: var(--gray-200); margin-bottom: 0.4rem; font-weight: 500; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 0.65rem 0.85rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--white); font-size: 0.9rem;
            outline: none; transition: border-color 0.12s;
        }
        input:focus { border-color: var(--border-hover); }
        .btn-primary {
            width: 100%; padding: 0.7rem;
            background: var(--accent-green); color: #15240a;
            border: none; border-radius: var(--radius-pill);
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            margin-top: 0.5rem; transition: opacity 0.12s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .alert {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; font-size: 0.8rem; padding: 0.6rem 0.8rem;
            border-radius: var(--radius-md); margin-bottom: 1.1rem;
        }
        .alert-success {
            background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
            color: #86efac; font-size: 0.8rem; padding: 0.6rem 0.8rem;
            border-radius: var(--radius-md); margin-bottom: 1.1rem;
        }
        .divider {
            display: flex; align-items: center; gap: 0.75rem;
            margin: 1.5rem 0; color: var(--gray-300); font-size: 0.78rem;
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--border);
        }
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            width: 100%; padding: 0.6rem;
            background: #ffffff; color: #1f1f1f;
            border: 1px solid #dadce0; border-radius: var(--radius-pill);
            font-family: 'Roboto', var(--font), sans-serif;
            font-weight: 500; font-size: 0.88rem; letter-spacing: 0.15px;
            cursor: pointer; text-decoration: none;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .btn-google:hover {
            background: #f8f9fa;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
        .switch-link {
            text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--gray-300);
        }
        .switch-link a { color: var(--cyan); font-weight: 600; text-decoration: none; }
        .back-home { text-align: center; margin-top: 1rem; }
        .back-home a { color: var(--gray-300); font-size: 0.8rem; text-decoration: none; }
        .back-home a:hover { color: var(--white); }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-logo">V</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your apps</p>

    <div class="alert" th:if="${param.error}">
        Invalid email or password.
    </div>
    <div class="alert-success" th:if="${param.registered}">
        Account created — log in below.
    </div>
    <div class="alert-success" th:if="${param.logout}">
        You've been logged out.
    </div>
    <div class="alert-success" th:if="${param.reset}">
        Password reset — log in with your new password.
    </div>

    <form method="post" th:action="@{/auth/login}">
        <div class="field">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" autocomplete="email" required/>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required/>
        </div>
        <button class="btn-primary" type="submit">Log in</button>
    </form>

    <div class="divider">or</div>

    <a class="btn-google" th:href="@{/oauth2/authorization/google}">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continue with Google
    </a>

    <p class="switch-link">Don't have an account? <a th:href="@{/auth/register}">Sign up</a></p>
    <p class="switch-link" style="margin-top:0.6rem;">
        <a th:href="@{/auth/forgot-password}">Forgot password?</a>
    </p>
    <p class="back-home"><a th:href="@{/}">&larr; Back to Vibe</a></p>
</div>
</body>
</html>
