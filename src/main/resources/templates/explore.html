<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Explore — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:           #233141;
            --bg-darker:    #151e2b;
            --card-bg:      #1e2a3a;
            --card-bg2:     #2a3849;
            --border:       rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.18);
            --white:        #ffffff;
            --gray-100:     #e8e8e8;
            --gray-200:     #b0b8c4;
            --gray-300:     #7a8494;
            --gray-400:     #4a5568;
            --gold:         #f59e0b;
            --blue:         #3b82f6;
            --accent-green: rgba(143,230,4,1);
            --radius-sm:    6px;
            --radius-md:    10px;
            --radius-lg:    14px;
            --radius-xl:    16px;
            --radius-pill:  999px;
            --font: 'Sora', sans-serif;
        }
        * { font-family: var(--font); }
        body { background: var(--bg); color: var(--white); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        button { font-family: var(--font); cursor: pointer; }

        /* ── HERO (copied 1:1 from the homepage hero — title text only differs) ── */
        .hero {
            position: relative; height: 380px; overflow: hidden; background: #0d1520;
        }
        .hero-bg {
            position: absolute; inset: 0; z-index: 1;
            background-image: url(HOME-hero3.png);
            background-size: 50%; background-position: center right; background-repeat: no-repeat; opacity: 0.9;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(13,21,32,0.88) 0%, rgba(13,21,32,0.65) 35%, rgba(13,21,32,0.15) 65%, transparent 100%);
        }
        .hero-fade {
            position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, transparent, #1a2332); pointer-events: none;
        }
        .hero-inner {
            position: relative; height: 100%; max-width: 1100px; margin: 0 auto; padding: 0 2rem;
        }
        .hero-content {
            position: relative; height: 100%; display: flex; flex-direction: column;
            justify-content: center; padding-top: calc(var(--nav-h) + 0.5rem); max-width: 560px;
        }
        .hero-heading {
            font-size: 3rem; font-weight: 700; color: var(--white);
            line-height: 1.05; letter-spacing: 0.5px;
        }

        .top-bar {
            background: #233141;
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
            max-width: 1100px; margin: 0 auto; padding: 0.9rem 2rem;
        }

        .tab-pill {
            display: inline-flex; align-items: center;
            padding: 0.4rem 1.05rem;
            border: 1.5px solid rgba(255,255,255,0.22);
            border-radius: var(--radius-pill);
            font-size: 0.76rem; font-weight: 700;
            color: var(--white); background: transparent;
            transition: all 0.12s; white-space: nowrap;
        }
        .tab-pill:hover { border-color: rgba(255,255,255,0.45); }
        .tab-pill.active {
            background: #0a0d12;
            color: #f0f0f1;
            /* border-color: var(--white); */
        }

        .search-wrap {
            margin-left: 50px;
            display: flex; align-items: center;
            background: var(--white); border-radius: var(--radius-pill);
            padding: 0.4rem 1rem; gap: 0.45rem; min-width: 190px;
            background: rgb(0 192 255);
            border: 1.5px solid rgb(0 112 255);
        }
        .search-icon { width: 13px; height: 13px; flex-shrink: 0; color: #9aa; }
        .search-input {
            border: none; outline: none; font-size: 0.9rem;
            font-family: var(--font); width: 100%; background: transparent; color: #111;
        }
        .search-input::placeholder { color: #aaa; }

        /* ── ACTIVE FILTER STRIP ────────────────────────────────────── */
        .active-filters-strip {
            display: none; align-items: center; gap: 0.4rem; flex-wrap: wrap;
            padding: 0.6rem 2rem; max-width: 1100px; margin: 0 auto;
            font-size: 0.74rem;
        }
        .active-filters-strip.show { display: flex; }
        .active-filter-chip {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.5rem 0.2rem 0.7rem;
            background: var(--card-bg2); border: 1px solid var(--border); color: var(--white);
            border-radius: var(--radius-pill); font-size: 0.68rem; font-weight: 600;
        }
        .active-filter-chip button {
            background: rgba(255,255,255,0.12); border: none; color: white;
            width: 14px; height: 14px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 0.5rem; padding: 0; flex-shrink: 0; font-family: var(--font);
        }
        .active-filter-chip button:hover { background: rgba(255,255,255,0.28); }
        .clear-all-btn {
            margin-left: auto; font-size: 0.72rem; color: var(--gray-200);
            cursor: pointer; background: none; border: none; font-family: var(--font);
        }
        .clear-all-btn:hover { color: var(--white); }

        /* ── LAYOUT ──────────────────────────────────────────────────── */
        .layout {
            display: grid; grid-template-columns: 260px 1fr; gap: 1.75rem;
            max-width: 1100px; margin: 0 auto; padding: 1.75rem 2rem 5rem;
        }

        /* ── SIDEBAR ─────────────────────────────────────────────────── */
        .sidebar { display: flex; flex-direction: column; gap: 1rem; }

        .filter-card {
            background: rgba(46, 72, 94, 1);
            border-radius: var(--radius-xl);
            padding: 1.1rem;
        }

        .filter-group-header {
            display: inline-flex; align-items: center; gap: 0.4rem;
            border-radius: var(--radius-pill);
            padding: 0.22rem 0.55rem; margin-bottom: 0.75rem;
        }
        .filter-group-title {
            font-size: 0.82rem;
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--white);
        }
        .filter-group-count { font-size: 0.6rem; font-weight: 700; color: var(--gray-300); }
        .filter-group-clear {
            font-size: 0.62rem; color: rgb(180 180 180); cursor: pointer;
            font-weight: 700; background: none; border: none; font-family: var(--font);
            display: none; margin-bottom: 0.6rem;
        }
        .filter-group-clear.show { display: inline-block; }
        .filter-group-clear:hover { text-decoration: underline; }

        .filter-item {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.34rem 0.5rem; border-radius: var(--radius-pill);
            cursor: pointer; user-select: none;
            font-size: 0.78rem; color: var(--gray-200);
            transition: background 0.1s, color 0.1s;
        }
        .filter-item:hover { background: rgba(255,255,255,0.05); color: var(--white); }

        /* Active state: lighter pill background, similar to .filter-group-header
           but a lighter shade — this is a "selected" state, not a permanent
           label, so it shouldn't look identical to the always-on group header. */
        .filter-item.active {
            background: #0a0d12;
            color: var(--white);
            font-weight: 700;
        }

        .filter-item-icon { width: 14px; height: 14px; border-radius: 3px; object-fit: contain; flex-shrink: 0; }
        .filter-item-name { flex: 1; min-width: 0; }
        .filter-item-count { font-size: 0.62rem; color: var(--gray-400); font-weight: 500; flex-shrink: 0; margin-left: auto; }
        .filter-item.active .filter-item-count { color: rgba(255,255,255,0.7); }

        .sidebar-empty { color: var(--gray-300); font-size: 0.75rem; text-align: center; padding: 1rem 0.5rem; line-height: 1.6; }
        .sidebar-empty a { color: var(--accent-green); font-weight: 700; }

        /* ── CONTENT ─────────────────────────────────────────────────── */
        .content { min-width: 0; }
        .section { margin-bottom: 2.25rem; }

        .section-title {
            font-size: 0.98rem;
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-left: 10px;
            color: #fcfcfc;
            padding-bottom: 0.5rem;
        }

        .empty-section { color: var(--gray-400); font-size: 0.8rem; text-align: center; padding: 2rem 0; }

        /* ── APP LIST CARD ──────────────────────────────────────────── */
        .app-card {
            display: flex; align-items: center; gap: 0.85rem;
            padding: 0.75rem 0.6rem; border-radius: var(--radius-lg);
            transition: background 0.12s;
        }
        .app-card:hover { background: rgba(255,255,255,0.04); }

        .app-icon {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--gray-300)
        }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }

        .app-body { flex: 1; min-width: 0; }
        .app-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: -0.2rem;
        }
        .app-desc {
            font-size: 0.77rem;
            color: var(--gray-200);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.65;
        }

        /* ── APP INDICATOR BADGES (video / screenshots / workflows) ──── */
        .app-indicators { }
        .app-indicator-badge {
            width: 22px; height: 18px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .app-indicator-badge svg { width: 12px; height: 12px; stroke: rgba(255,255,255,0.85); fill: none; stroke-width: 2; }

        .app-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; flex-shrink: 0; }

        .rating-row { display: flex; align-items: center; gap: 0.4rem; }
        .rating-block { display: flex; align-items: center; gap: 0.2rem; }
        .rating-sep { color: var(--gray-400); font-size: 0.65rem; }

        .stars { display: flex; gap: 1px; }
        .star { font-size: 0.68rem; color: var(--gray-400); }
        .star.lit-user { color: var(--gold); }
        .star.lit-verified { color: var(--blue); }

        .rating-count { font-size: 0.64rem; color: var(--gray-300); font-weight: 500; }

        /* ── LOAD MORE ─────────────────────────────────────────────── */
        .load-more-wrap { display: flex; justify-content: center; padding-top: 0.75rem; }
        .btn-load-more {
            background: var(--card-bg2); border: 1.5px solid var(--border);
            color: var(--white); font-size: 0.76rem; font-weight: 700;
            padding: 0.45rem 1.3rem; border-radius: var(--radius-pill);
            transition: border-color 0.12s, background 0.12s, opacity 0.12s;
        }
        .btn-load-more:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.06); }
        .btn-load-more:disabled { opacity: 0.55; cursor: default; }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .hero { height: 280px; }
            .hero-content { max-width: 100%; }
            .hero-heading { font-size: 2rem; }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<!-- ── HERO (identical to homepage, only the heading text differs) ────── -->
<div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-fade"></div>
    <div class="hero-inner">
        <div class="hero-content">
            <h1 class="hero-heading">Explore apps</h1>
        </div>
    </div>
</div>

<!-- ── TOP FILTER BAR (tabs + search, below the hero) ──────────────────── -->
<div class="top-bar-outer">
    <div class="top-bar">
        <a class="tab-pill"
           th:classappend="${tab == 'top-rated'} ? ' active' : ''"
           th:href="@{/explore(tab='top-rated')}"
           data-tab="top-rated"
           onclick="return handleTabClick(event, this)"
           id="tabTopRated">Top rated</a>

        <a class="tab-pill"
           th:classappend="${tab == 'new'} ? ' active' : ''"
           th:href="@{/explore(tab='new')}"
           data-tab="new"
           onclick="return handleTabClick(event, this)"
           id="tabNew">NEW</a>

        <a class="tab-pill"
           th:classappend="${tab == 'verified'} ? ' active' : ''"
           th:href="@{/explore(tab='verified')}"
           data-tab="verified"
           onclick="return handleTabClick(event, this)"
           id="tabVerified">Verified</a>
        <a class="tab-pill"
           th:classappend="${tab == 'ranked'} ? ' active' : ''"
           th:href="@{/explore(tab='ranked')}"
           data-tab="ranked"
           onclick="return handleTabClick(event, this)"
           id="tabRanked">Ranked</a>

        <div class="search-wrap">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input class="search-input" type="text" id="searchInput" placeholder="Find an app..."/>
        </div>
    </div>
</div>

<!-- Active-filter summary strip (JS-managed) -->
<div class="active-filters-strip" id="activeFiltersStrip">
    <button class="clear-all-btn" onclick="clearAllFilters()">Clear all</button>
</div>

<div class="layout">

    <!-- ── SIDEBAR ─────────────────────────────────────────────────── -->
    <aside class="sidebar">
        <th:block th:each="cat, catStat : ${filterEntries.entrySet()}"
                  th:with="catId=${cat.key.id},
                            catCount=${categoryAppCounts[cat.key.id]}">

            <div class="filter-card" th:id="'fg-' + ${catId}">
                <div class="filter-group-header">
                    <span class="filter-group-title" th:text="'ALL ' + ${cat.key.name.toUpperCase()}">ALL CATEGORIES</span>
                    <span class="filter-group-count"
                          th:if="${catCount != null and catCount > 0}"
                          th:text="'(' + ${catCount} + ')'"></span>
                </div>
                <button class="filter-group-clear"
                        th:id="'clear-' + ${catId}"
                        th:data-cat-id="${catId}"
                        onclick="clearGroup(this.dataset.catId)">Clear</button>

                <div th:each="entry : ${cat.value}"
                     class="filter-item"
                     th:id="'fi-' + ${entry.id}"
                     th:data-entry-id="${entry.id}"
                     th:data-entry-name="${entry.name}"
                     th:title="${entry.description}"
                     th:data-cat-id="${catId}"
                     th:classappend="${#lists.contains(selectedEntryIds, entry.id.toString())} ? ' active' : ''"
                     onclick="toggleFilter(this)">
                    <img th:if="${entry.iconUrl != null}"
                         th:src="${entry.iconUrl}"
                         th:alt="${entry.name}"
                         class="filter-item-icon"/>
                    <span class="filter-item-name" th:text="${entry.name}">Entry</span>
                    <span class="filter-item-count"
                          th:if="${entryAppCounts[entry.id] != null and entryAppCounts[entry.id] > 0}"
                          th:text="'(' + ${entryAppCounts[entry.id]} + ')'"></span>
                </div>
            </div>
        </th:block>

        <div th:if="${#maps.isEmpty(filterEntries)}" class="filter-card sidebar-empty">
            No filter categories.<br/>
            <a th:href="@{/categories}">Manage →</a>
        </div>
    </aside>

    <!-- ── CONTENT: two sections ────────────────────────────────────── -->
    <main class="content" id="mainContent">

        <!-- Section 1 -->
        <div class="section">
            <div class="section-title" th:text="${section1Title}">TOP USER RATED APPS</div>

            <div th:if="${#lists.isEmpty(section1Apps)}" class="empty-section">
                No apps yet in this section.
            </div>

            <div class="app-cards-list" id="section1List">
                <th:block th:insert="~{fragments/app-cards :: cards(${section1Apps}, ${appsWithVideo}, ${appsWithImages}, ${appsWithWorkflows})}"></th:block>
            </div>

            <div class="load-more-wrap" th:if="${hasMoreSection1}">
                <button class="btn-load-more" type="button" data-section="1" data-offset="5" onclick="loadMore(this)">Load more</button>
            </div>
        </div>

        <!-- Section 2 -->
        <div class="section">
            <div class="section-title" th:text="${section2Title}">TOP VERIFIED APPS</div>

            <div th:if="${#lists.isEmpty(section2Apps)}" class="empty-section">
                No apps yet in this section.
            </div>

            <div class="app-cards-list" id="section2List">
                <th:block th:insert="~{fragments/app-cards :: cards(${section2Apps}, ${appsWithVideo}, ${appsWithImages}, ${appsWithWorkflows})}"></th:block>
            </div>

            <div class="load-more-wrap" th:if="${hasMoreSection2}">
                <button class="btn-load-more" type="button" data-section="2" data-offset="5" onclick="loadMore(this)">Load more</button>
            </div>
        </div>

    </main>
</div>

<!-- Hidden form for sidebar filter submissions (preserves active tab) -->
<form id="filterForm" th:action="@{/explore}" method="get" style="display:none;">
    <input type="hidden" name="tab" id="tabInput" th:value="${tab}"/>
    <div id="filterInputs"></div>
</form>

<script th:inline="javascript">
    // ── State ────────────────────────────────────────────────────────────────
    const preSelected = /*[[${selectedEntryIds}]]*/ [];

    let currentTab   = /*[[${tab}]]*/ 'top-rated';
    let selectedIds  = new Set(preSelected.map(String));
    let entryMeta    = {};
    let requestToken = 0; // guards against out-of-order responses

    buildEntryMetaCache();

    function buildEntryMetaCache() {
        entryMeta = {};
        document.querySelectorAll('.filter-item[data-entry-id]').forEach(el => {
            entryMeta[el.dataset.entryId] = { name: el.dataset.entryName, catId: el.dataset.catId };
        });
    }

    // ── Sidebar filter toggle ────────────────────────────────────────────────
    function toggleFilter(el) {
        const id = el.dataset.entryId;
        if (selectedIds.has(id)) {
            selectedIds.delete(id);
            el.classList.remove('active');
        } else {
            selectedIds.add(id);
            el.classList.add('active');
        }
        renderActiveStrip();
        updateResults();
    }

    function clearGroup(catId) {
        document.querySelectorAll(`.filter-item[data-cat-id="${catId}"]`).forEach(el => {
            selectedIds.delete(el.dataset.entryId);
            el.classList.remove('active');
        });
        renderActiveStrip();
        updateResults();
    }

    function clearAllFilters() {
        selectedIds.clear();
        document.querySelectorAll('.filter-item.active').forEach(el => el.classList.remove('active'));
        renderActiveStrip();
        updateResults();
    }

    function removeChip(id) {
        selectedIds.delete(id);
        const el = document.getElementById('fi-' + id);
        if (el) el.classList.remove('active');
        renderActiveStrip();
        updateResults();
    }

    function switchTab(tabName) {
        if (tabName === currentTab) return;
        currentTab = tabName;
        document.querySelectorAll('.tab-pill').forEach(link => {
            link.classList.toggle('active', link.dataset.tab === tabName);
        });
        updateResults();
    }

    // ── Build the /explore URL for the current tab + filters ─────────────────
    function buildUrl() {
        const params = new URLSearchParams();
        params.set('tab', currentTab);
        selectedIds.forEach(id => params.append('entries', id));
        return '/explore?' + params.toString();
    }

    // ── Fetch the same page server-side-rendered, swap in the fresh markup ───
    // Note: this always brings back section 1 & 2 reset to their first page
    // (offset 0) with fresh "Load more" buttons — exactly what we want any
    // time the tab or filters change.
    async function updateResults() {
        const url   = buildUrl();
        const token = ++requestToken;

        history.pushState({ tab: currentTab, entries: [...selectedIds] }, '', url);

        try {
            const res = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
            if (token !== requestToken) return; // a newer request superseded this one
            if (!res.ok) throw new Error('Bad response');

            const html = await res.text();
            const doc  = new DOMParser().parseFromString(html, 'text/html');

            const newSidebar = doc.querySelector('.sidebar');
            const newMain    = doc.getElementById('mainContent');

            if (newSidebar) document.querySelector('.sidebar').replaceWith(newSidebar);
            if (newMain)    document.getElementById('mainContent').replaceWith(newMain);

            buildEntryMetaCache();
            renderActiveStrip();
            applySearchFilter();
        } catch (e) {
            // Fallback: if fetch fails for any reason, do a real navigation
            window.location.href = url;
        }
    }

    // ── Support browser back/forward through the filter/tab history ─────────
    window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        currentTab  = params.get('tab') || 'top-rated';
        selectedIds = new Set(params.getAll('entries'));

        document.querySelectorAll('.tab-pill').forEach(link => {
            link.classList.toggle('active', link.dataset.tab === currentTab);
        });
        document.querySelectorAll('.filter-item[data-entry-id]').forEach(el => {
            el.classList.toggle('active', selectedIds.has(el.dataset.entryId));
        });

        updateResults();
    });

    // ── Active filter chip strip ─────────────────────────────────────────────
    function renderActiveStrip() {
        const strip    = document.getElementById('activeFiltersStrip');
        const clearBtn = strip.querySelector('.clear-all-btn');
        strip.querySelectorAll('.active-filter-chip').forEach(c => c.remove());

        if (selectedIds.size === 0) {
            strip.classList.remove('show');
        } else {
            strip.classList.add('show');
            selectedIds.forEach(id => {
                const meta = entryMeta[id]; if (!meta) return;
                const chip = document.createElement('span');
                chip.className = 'active-filter-chip';
                chip.innerHTML = `${meta.name}<button onclick="removeChip('${id}')">✕</button>`;
                strip.insertBefore(chip, clearBtn);
            });
        }

        // Per-group clear button visibility
        const usedCats = new Set([...selectedIds].map(id => entryMeta[id]?.catId));
        document.querySelectorAll('.filter-group-clear').forEach(btn => {
            btn.classList.toggle('show', usedCats.has(btn.dataset.catId));
        });
    }

    // ── Client-side search ───────────────────────────────────────────────────
    function applySearchFilter() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        document.querySelectorAll('#mainContent .app-card').forEach(card => {
            const match = !q
                || (card.dataset.name || '').includes(q)
                || (card.dataset.desc || '').includes(q);
            card.style.display = match ? '' : 'none';
        });
    }
    document.getElementById('searchInput').addEventListener('input', applySearchFilter);

    // ── Load more (per section, appends the next batch of cards) ────────────
    async function loadMore(btn) {
        const section = btn.dataset.section;         // '1' or '2'
        const offset  = parseInt(btn.dataset.offset, 10) || 0;

        const params = new URLSearchParams();
        params.set('tab', currentTab);
        params.set('section', section);
        params.set('offset', offset);
        selectedIds.forEach(id => params.append('entries', id));

        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Loading…';

        try {
            const res = await fetch('/explore/more?' + params.toString(), {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            if (!res.ok) throw new Error('Bad response');

            const html       = await res.text();
            const hasMore     = res.headers.get('X-Has-More') === 'true';
            const nextOffset  = parseInt(res.headers.get('X-Next-Offset') || '0', 10);

            const list = document.getElementById('section' + section + 'List');
            const temp = document.createElement('div');
            temp.innerHTML = html;
            [...temp.children].forEach(child => list.appendChild(child));

            // Newly appended cards should respect whatever's currently typed
            // in the search box, same as the cards already on the page.
            applySearchFilter();

            if (hasMore) {
                btn.dataset.offset = nextOffset;
                btn.disabled = false;
                btn.textContent = originalText;
            } else {
                btn.closest('.load-more-wrap').remove();
            }
        } catch (e) {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    renderActiveStrip();
</script>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
