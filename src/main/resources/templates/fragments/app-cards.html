<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Reusable app-card list, parameterized so it can be called both for the
    initial page render (explore.html, section 1 & 2) and for the
    /explore/more AJAX "load more" responses — one source of markup instead
    of two copies that can quietly drift apart.
-->
<th:block th:fragment="cards(apps, appsWithVideo, appsWithImages, appsWithWorkflows)">
    <th:block th:each="app : ${apps}">
        <a class="app-card"
           th:href="@{/apps/{id}/manage(id=${app.id})}"
           th:data-name="${app.name.toLowerCase()}"
           th:data-desc="${app.description != null ? app.description.toLowerCase() : ''}">

            <div class="app-icon">
                <img th:if="${app.iconUrl != null}" th:src="${app.iconUrl}" alt=""/>
                <span th:if="${app.iconUrl == null}">🖼</span>
            </div>

            <div class="app-body">
                <div class="app-name" th:text="${app.name}">App Name</div>
                <div class="app-desc"
                     th:text="${app.description != null ? app.description : 'No description'}">
                </div>
                <div class="app-indicators">
    <span th:if="${appsWithVideo.contains(app.id)}" title="Has video">
        <svg width="22" height="16" viewBox="0 0 26 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="25" height="15" rx="2.5" fill="#D9D9D9" fill-opacity="0.01" stroke="white"/>
            <path d="M18 8L10.5 12.3301L10.5 3.66987L18 8Z" fill="white"/>
        </svg>
    </span>
                    <span th:if="${appsWithImages.contains(app.id)}" title="Has screenshots">
        <svg width="22" height="16" viewBox="0 0 26 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="25" height="15" rx="2.5" fill="#D9D9D9" fill-opacity="0.01" stroke="white"/>
            <path d="M4 14L6.70888 11.3418C7.51226 10.5534 8.80773 10.583 9.57426 11.4073L9.61721 11.4535C10.4352 12.333 11.8384 12.2983 12.6119 11.3794L16.2694 7.03422C17.1265 6.01593 18.7206 6.10334 19.4613 7.20925L22 11" stroke="white" stroke-linecap="round"/>
            <circle cx="9.5" cy="5.5" r="3" stroke="white"/>
        </svg>
    </span>
                    <span th:if="${appsWithWorkflows.contains(app.id)}" title="Has workflows">
        <svg width="22" height="16" viewBox="0 0 26 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="25" height="15" rx="2.5" fill="#D9D9D9" fill-opacity="0.01" stroke="white"/>
            <path d="M4 5L8 5C9.10457 5 10 5.89543 10 7V9C10 10.1046 9.10457 11 8 11H4" stroke="white" stroke-linecap="round"/>
            <path d="M22 5L18 5C16.8954 5 16 5.89543 16 7V9C16 10.1046 16.8954 11 18 11H22" stroke="white" stroke-linecap="round"/>
            <line x1="16" y1="8" x2="10" y2="8" stroke="white"/>
        </svg>
    </span>
                </div>
            </div>

            <div class="app-card-right">
                <div class="rating-row">
                    <!-- User rating (gold stars) -->
                    <div class="rating-block">
                        <div class="stars">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  class="star"
                                  th:classappend="${app.userRatingAvg >= i} ? ' lit-user' : ''">★</span>
                        </div>
                        <span class="rating-count"
                              th:text="${#numbers.formatDecimal(app.userRatingAvg,1,1)} + ' (' + ${app.userRatingCount} + ')'">0</span>
                    </div>
                    <span class="rating-sep">|</span>
                    <!-- Verified rating (blue stars) -->
                    <div class="rating-block">
                        <div class="stars" th:if="${app.verifiedScore != null}">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  class="star"
                                  th:classappend="${app.verifiedScore >= i} ? ' lit-verified' : ''">★</span>
                        </div>
                        <span th:if="${app.verifiedScore != null}"
                              style="font-size:0.64rem;color:var(--blue);font-weight:700;"
                              th:text="${#numbers.formatDecimal(app.verifiedScore,1,1)}"></span>
                        <span th:if="${app.verifiedScore == null}"
                              style="font-size:0.64rem;color:var(--gray-400);">—</span>
                    </div>
                </div>
            </div>
        </a>
    </th:block>
</th:block>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
