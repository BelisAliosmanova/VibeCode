<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
 <th:block th:fragment="favicons">
        <link rel="icon" th:href="@{/favico-b.svg}" type="image/svg+xml" media="(prefers-color-scheme: light)"/>
        <link rel="icon" th:href="@{/favico-w.svg}" type="image/svg+xml" media="(prefers-color-scheme: dark)"/>
        <link rel="alternate icon" th:href="@{/favicon.ico}"/>
    </th:block>
    <link rel="stylesheet" th:href="@{/css/navbar.css}" th:fragment="navbar-css"/>
</head>
<body>

<nav th:fragment="navbar">

    <th:block th:fragment="favicons">
        <link rel="icon" th:href="@{/favico-b.svg}" type="image/svg+xml" media="(prefers-color-scheme: light)"/>
        <link rel="icon" th:href="@{/favico-w.svg}" type="image/svg+xml" media="(prefers-color-scheme: dark)"/>
        <link rel="alternate icon" th:href="@{/favicon.ico}"/>
    </th:block>
    <div class="nav-left">
        <a class="nav-logo" href="/" th:href="@{/}">
            <img alt="Vibe logo" src="/logo_sm.png" style="width:100%;height:100%;object-fit:cover;background:black;"
                 th:src="@{/logo_sm.png}"/>
        </a>
        <a class="nav-link" href="/explore" th:href="@{/explore}">Explore</a>
        <a class="nav-link" href="/apps" th:href="@{/apps}">Wish an app</a>
    </div>
    <div class="nav-right">
        <span sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <a class="nav-link" th:href="@{/review-categories}">Reviews</a>
    </span>
    <span sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <a class="nav-link" th:href="@{/admin/ranking}">Ranking Apps</a>
    </span>
        <span sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <a class="nav-link" th:href="@{/apps}">Manage Apps</a>
    </span>
        <span sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <a class="nav-link" th:href="@{/admin/home-sections}">Home Sections</a>
    </span>
        <span sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" th:href="@{/categories}">Categories</a>
    </span>
        <span sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" th:href="@{/admin/users}">Users</a>
    </span>

        <span sec:authorize="isAuthenticated()" class="nav-link" sec:authentication="name"></span>

        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/auth/logout}" style="display:inline">
            <button class="btn-nav-ghost" type="submit">Log out</button>
        </form>

        <a sec:authorize="isAnonymous()" class="btn-nav-ghost" th:href="@{/auth/login}">Log in</a>
        <a class="btn-submit-app" href="/submit" th:href="@{/submit}">Submit your app</a>
    </div>
</nav>
</body>
</html>
