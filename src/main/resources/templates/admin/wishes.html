<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Wished apps — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --white:#fff; --gray-200:#b0b8c4; --gray-300:#7a8494; --accent-green:rgba(143,230,4,1); --radius-xl:16px; --radius-pill:999px; --font:'Sora',sans-serif; }
        * { font-family:'Sora',sans-serif; }
        body { background:#233141; color:var(--white); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }

/* ── Page hero: one banner that sits behind the transparent navbar ── */
        .page-hero {
            position:relative; z-index:0; overflow:hidden;
            height:calc(var(--nav-h) + 85px);
            background:linear-gradient(100deg, #101a27 0%, #16212f 45%, #1b2838 100%);
        }
        .hero-tiles { position:absolute; inset:0; }
        .hero-tile {
            position:absolute; border-radius:16px;
            transform:rotate(-22deg) skewX(-8deg);
            box-shadow:0 6px 18px rgba(0,0,0,.35);
        }
        .t1 { left:57%; top:22%; width:60px; height:44px; background:linear-gradient(135deg,#6b7a99,#3d4a63); filter:blur(7px); opacity:.45; }
        .t2 { left:61%; top:46%; width:66px; height:46px; background:linear-gradient(135deg,#8a5cf0,#4b2a9a); filter:blur(3px); opacity:.85; }
        .t3 { left:75%; top:40%; width:70px; height:48px; background:linear-gradient(135deg,#6fd145,#2f8a3a); filter:blur(3px); opacity:.85; }
        .t4 { left:85%; top:34%; width:78px; height:52px; background:linear-gradient(135deg,#f0e04a,#c9a82a); filter:blur(1px); }
        .t5 { left:55%; top:92%; width:66px; height:46px; background:linear-gradient(135deg,#ff3aa0,#ffb02e); filter:blur(.5px); }
        .t6 { left:73%; top:96%; width:78px; height:54px; background:linear-gradient(135deg,#ffc42e,#e8481c); }
        .t7 { left:91%; top:100%; width:84px; height:58px; background:linear-gradient(135deg,#ff6a5a,#d41f2a); }
        .t8 { left:84%; top:132%; width:60px; height:44px; background:linear-gradient(135deg,#4fe0ff,#2b7fe0); filter:blur(4px); opacity:.8; }
        .page-hero-inner { position:relative; height:100%; max-width:1100px; margin:0 auto; padding:0 2rem; display:flex; align-items:flex-end; justify-content:space-between; }
        .page-hero-title { font-size:2.4rem; font-weight:700; line-height:1.05; letter-spacing:.5px; padding-bottom:1.6rem; }
        .hero-count { padding-bottom:1.9rem; font-size:.8rem; color:var(--gray-200); }
        .hero-count b { color:var(--accent-green); }

        .content { max-width:1100px; margin:0 auto; padding:2rem 2rem 5rem; }

        .table-card {
            background:radial-gradient(77.26% 147.49% at 63.01% 100%, #475b72 0%, #233141 100%);
            border-radius:var(--radius-xl);
            overflow:hidden;
        }
        .table-scroll { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; min-width:820px; }
        thead th {
            text-align:left; font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
            color:var(--gray-200); padding:1rem 1.2rem; background:rgba(0,0,0,.25);
            border-bottom:1px solid rgba(255,255,255,.08);
        }
        tbody td { padding:.95rem 1.2rem; vertical-align:top; border-bottom:1px solid rgba(255,255,255,.06); font-size:.78rem; }
        tbody tr:last-child td { border-bottom:none; }
        tbody tr:hover { background:rgba(255,255,255,.03); }
        tr.handled td { opacity:.5; }

        .col-date  { white-space:nowrap; color:var(--gray-200); width:130px; }
        .col-desc  { width:42%; white-space:pre-wrap; word-break:break-word; }
        .col-actions { white-space:nowrap; text-align:right; width:190px; }
        .email-link { color:rgba(83,184,255,1); }
        .email-link:hover { text-decoration:underline; }
        .muted { color:var(--gray-300); }

        .badge { display:inline-block; font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:.25rem .7rem; border-radius:8px; background:#000; }
        .badge-open { color:var(--accent-green); }
        .badge-done { color:var(--gray-300); }

        .btn-mini {
            background:transparent; color:var(--white); font-size:.7rem; font-weight:700; cursor:pointer;
            border:1.5px solid var(--accent-green); border-radius:var(--radius-pill); padding:.25rem .85rem;
            transition:background .12s;
        }
        .btn-mini:hover { background:rgba(255,255,255,.08); }
        .btn-mini.danger { border-color:rgba(255,75,114,1); }

        .empty-state { text-align:center; padding:3rem 2rem; color:var(--gray-300); opacity:.7; }
        form.inline { display:inline; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div>

    <div class="page-hero">
        <div class="hero-tiles"><span class="hero-tile t1"></span><span class="hero-tile t2"></span><span class="hero-tile t3"></span><span class="hero-tile t4"></span><span class="hero-tile t5"></span><span class="hero-tile t6"></span><span class="hero-tile t7"></span><span class="hero-tile t8"></span></div>
        <div class="page-hero-inner">
            <h1 class="page-hero-title">Wished apps</h1>
            <div class="hero-count">
                <b th:text="${openCount}">0</b> open · <span th:text="${#lists.size(wishes)}">0</span> total
            </div>
        </div>
    </div>

    <main class="content">
        <div class="table-card">
            <div class="table-scroll">
                <table th:if="${!#lists.isEmpty(wishes)}">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Wished app</th>
                        <th>Budget</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="w : ${wishes}" th:classappend="${w.handled} ? 'handled'">
                        <td class="col-date" th:text="${#temporals.format(w.createdAt, 'dd MMM yyyy HH:mm')}">01 Jan 2026</td>
                        <td class="col-desc" th:text="${w.description}">Description</td>
                        <td>
                            <span th:if="${w.budget != null}" th:text="${w.budget}"></span>
                            <span class="muted" th:if="${w.budget == null}">—</span>
                        </td>
                        <td><a class="email-link" th:href="'mailto:' + ${w.email}" th:text="${w.email}">a@b.com</a></td>
                        <td>
                            <span class="badge badge-open" th:if="${!w.handled}">Open</span>
                            <span class="badge badge-done" th:if="${w.handled}">Handled</span>
                        </td>
                        <td class="col-actions">
                            <form class="inline" method="post" th:action="@{/admin/wishes/{id}/toggle(id=${w.id})}">
                                <button class="btn-mini" type="submit" th:text="${w.handled} ? 'Reopen' : 'Mark handled'">Mark handled</button>
                            </form>
                            <form class="inline" method="post" th:action="@{/admin/wishes/{id}/delete(id=${w.id})}"
                                  onsubmit="return confirm('Delete this wish? This cannot be undone.')">
                                <button class="btn-mini danger" type="submit" title="Delete">🗑</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(wishes)}">No wishes submitted yet.</div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
