<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
 <th:block th:fragment="favicons">
        <link rel="icon" th:href="@{/favico-b.svg}" type="image/svg+xml" media="(prefers-color-scheme: light)"/>
        <link rel="icon" th:href="@{/favico-w.svg}" type="image/svg+xml" media="(prefers-color-scheme: dark)"/>
        <link rel="alternate icon" th:href="@{/favicon.ico}"/>
    </th:block>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage users — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --panel: #1e2a3a; --panel2: #2a3a50;
            --border: rgba(255,255,255,0.1); --white: #fff;
            --gray-200: #b0b8c4; --gray-300: #7a8494;
            --blue: #2563eb; --green: #8fe604; --gold: #f4a118; --danger: #e05c5c;
            --radius-pill: 999px; --radius-md: 10px; --radius-lg: 14px;
            --font: 'Inter', system-ui, sans-serif;
        }
        body { font-family: var(--font); background: #0d1520; color: var(--white); font-size: 13px; line-height: 1.5; }
        a { color: inherit; text-decoration: none; }

        nav { display: flex; align-items: center; justify-content: space-between; padding: 0 1.75rem; height: 48px; background: #5a5a5a; }
        .nav-left { display: flex; align-items: center; gap: 1.5rem; }
        .nav-logo { width: 26px; height: 26px; background: #222; border-radius: 50%; }
        .nav-link { color: #fff; opacity: 0.85; font-size: 0.82rem; }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .btn-outline-nav { border: 1.5px solid #fff; color: #fff; font-size: 0.75rem; padding: 0.28rem 0.8rem; border-radius: var(--radius-pill); }

        .page-header { background: #5a5a5a; color: #fff; text-align: center; padding: 1.1rem 1.5rem; font-size: 1.3rem; font-weight: 600; }

        .wrap { max-width: 1180px; margin: 1.5rem auto 3rem; padding: 0 1.5rem; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem; }
        .toolbar-title { font-size: 0.95rem; font-weight: 700; }

        .alert {
            background: rgba(224,92,92,0.12); border: 1px solid rgba(224,92,92,0.3);
            color: #fca5a5; font-size: 0.8rem; padding: 0.6rem 0.9rem;
            border-radius: var(--radius-md); margin-bottom: 1rem;
        }

        .content-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left; font-size: 0.62rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--gray-300); padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid var(--border); }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody td { padding: 0.65rem 1rem; vertical-align: middle; }

        .user-email { font-weight: 600; font-size: 0.82rem; }
        .user-you { font-size: 0.62rem; font-weight: 800; color: var(--gray-300); background: var(--panel2); padding: 0.08rem 0.4rem; border-radius: var(--radius-pill); margin-left: 0.4rem; text-transform: uppercase; }
        .provider-badge {
            font-size: 0.62rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: var(--radius-pill);
            border: 1.5px solid var(--border); color: var(--gray-300); white-space: nowrap;
        }

        select.role-select, select.status-select {
            background: var(--panel2); border: 1.5px solid var(--border); color: #fff;
            border-radius: 8px; padding: 0.35rem 0.5rem; font-size: 0.76rem; font-family: var(--font);
            outline: none; cursor: pointer;
        }
        select.role-select:focus, select.status-select:focus { border-color: var(--blue); }
        select.role-select:disabled, select.status-select:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-row-delete {
            background: none; border: 1.5px solid var(--border); color: var(--gray-300); cursor: pointer;
            font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.6rem; border-radius: 8px;
            font-family: var(--font); transition: all 0.1s;
        }
        .btn-row-delete:hover { color: var(--danger); border-color: var(--danger); }
        .btn-row-delete:disabled { opacity: 0.3; cursor: not-allowed; }

        .empty-state { color: var(--gray-300); font-size: 0.8rem; padding: 2rem; text-align: center; }

        form.inline-form { display: inline; }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a class="nav-logo" th:href="@{/}"></a>
        <a class="nav-link" th:href="@{/submit}">Submit</a>
        <a class="nav-link" th:href="@{/explore}">Explore</a>
        <a class="nav-link" th:href="@{/admin/home-sections}">Home sections</a>
    </div>
    <div class="nav-right">
        <a class="btn-outline-nav" th:href="@{/}">Back to site</a>
    </div>
</nav>

<div class="page-header">Manage users</div>

<div class="wrap">
    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <div class="toolbar">
        <div class="toolbar-title" th:text="${#lists.size(users)} + ' user' + (${#lists.size(users)} == 1 ? '' : 's')">0 users</div>
    </div>

    <div class="content-panel">
        <table>
            <thead>
            <tr>
                <th>Email</th>
                <th>Provider</th>
                <th>Role</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td>
                    <span class="user-email" th:text="${u.email}">user@example.com</span>
                    <span class="user-you" th:if="${u.id == currentUserId}">You</span>
                </td>
                <td>
                    <span class="provider-badge" th:text="${u.authProvider.name()}">LOCAL</span>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{'/admin/users/' + ${u.id} + '/role'}">
                        <select class="role-select" name="role"
                                th:disabled="${u.id == currentUserId}"
                                onchange="this.form.submit()">
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"
                                    th:selected="${r == u.role}"></option>
                        </select>
                    </form>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{'/admin/users/' + ${u.id} + '/status'}">
                        <select class="status-select" name="status"
                                th:disabled="${u.id == currentUserId}"
                                onchange="this.form.submit()">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${s == u.status}"></option>
                        </select>
                    </form>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{'/admin/users/' + ${u.id} + '/delete'}"
                          onsubmit="return confirm('Delete ' + '[[${u.email}]]' + '? This can\'t be undone from this screen.');">
                        <button type="submit" class="btn-row-delete" th:disabled="${u.id == currentUserId}">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(users)}">No users yet.</div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
