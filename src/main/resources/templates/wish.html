<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{index :: favicons}"></th:block> <!-- TODO: point to the template that defines your favicons fragment, or delete this line -->
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Wish an app — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --white: #ffffff;
            --gray-200: #b0b8c4;
            --gray-300: #7a8494;
            --accent-green: rgba(143,230,4,1);
            --radius-xl: 16px;
            --radius-pill: 999px;
            --font: 'Sora', sans-serif;
        }
        * { font-family: 'Sora', sans-serif; }
        body { background:#233141; color:var(--white); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }

        /* ── Page hero (slim version of the home hero) ── */
/* ── Page hero: one banner that sits behind the transparent navbar ── */
        .page-hero {
            position:relative; z-index:0; overflow:hidden;
            height:calc(var(--nav-h) + 85px);
            background:linear-gradient(100deg, #101a27 0%, #16212f 45%, #1b2838 100%);
        }
        .hero-tiles { position:absolute; inset:0; }
        .hero-tile {
            position:absolute; border-radius:16px;
            transform:rotate(-22deg) skewX(-8deg);
            box-shadow:0 6px 18px rgba(0,0,0,.35);
        }
        .t1 { left:57%; top:22%; width:60px; height:44px; background:linear-gradient(135deg,#6b7a99,#3d4a63); filter:blur(7px); opacity:.45; }
        .t2 { left:61%; top:46%; width:66px; height:46px; background:linear-gradient(135deg,#8a5cf0,#4b2a9a); filter:blur(3px); opacity:.85; }
        .t3 { left:75%; top:40%; width:70px; height:48px; background:linear-gradient(135deg,#6fd145,#2f8a3a); filter:blur(3px); opacity:.85; }
        .t4 { left:85%; top:34%; width:78px; height:52px; background:linear-gradient(135deg,#f0e04a,#c9a82a); filter:blur(1px); }
        .t5 { left:55%; top:92%; width:66px; height:46px; background:linear-gradient(135deg,#ff3aa0,#ffb02e); filter:blur(.5px); }
        .t6 { left:73%; top:96%; width:78px; height:54px; background:linear-gradient(135deg,#ffc42e,#e8481c); }
        .t7 { left:91%; top:100%; width:84px; height:58px; background:linear-gradient(135deg,#ff6a5a,#d41f2a); }
        .t8 { left:84%; top:132%; width:60px; height:44px; background:linear-gradient(135deg,#4fe0ff,#2b7fe0); filter:blur(4px); opacity:.8; }
        .page-hero-inner { position:relative; height:100%; max-width:1100px; margin:0 auto; padding:0 2rem; display:flex; align-items:flex-end; }
        .page-hero-title { font-size:2.4rem; font-weight:700; line-height:1.05; letter-spacing:.5px; padding-bottom:1.6rem; }

        /* ── Form ── */
        .wish-wrap { max-width:620px; margin:0 auto; padding:3rem 1.5rem 6rem; }
        .wish-form { display:flex; flex-direction:column; gap:.85rem; }
        .wish-field {
            width:100%;
            background:#1a2332;
            border:1px solid rgba(255,255,255,.12);
            border-radius:14px;
            color:var(--white);
            font-family:var(--font);
            font-size:.8rem;
            padding:.85rem 1rem;
            outline:none;
            transition:border-color .12s, box-shadow .12s;
        }
        .wish-field::placeholder { color:rgba(255,255,255,.75); }
        .wish-field:focus { border-color:rgba(255,255,255,.4); box-shadow:0 0 0 3px rgba(255,255,255,.05); }
        textarea.wish-field { min-height:150px; resize:vertical; }
        .hp { position:absolute; left:-9999px; opacity:0; height:0; width:0; }

        .wish-submit-row { display:flex; justify-content:center; margin-top:1.2rem; }
        .btn-wish-submit {
            background:var(--accent-green);
            color:#000;
            border:none;
            border-radius:var(--radius-pill);
            font-size:.9rem;
            font-weight:800;
            text-transform:uppercase;
            padding:.7rem 2.6rem;
            cursor:pointer;
            transition:filter .12s, transform .12s;
        }
        .btn-wish-submit:hover { filter:brightness(1.08); transform:translateY(-1px); }

        .alert { border-radius:14px; padding:.85rem 1.1rem; font-size:.8rem; margin-bottom:1rem; }
        .alert-error   { background:rgba(255,75,114,.12); border:1px solid rgba(255,75,114,.6); }
        .alert-success { background:rgba(143,230,4,.1);  border:1px solid var(--accent-green); }

        @media (max-width:768px) {
            .page-hero-title { font-size:1.8rem; }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div>

    <div class="page-hero">
        <div class="hero-tiles"><span class="hero-tile t1"></span><span class="hero-tile t2"></span><span class="hero-tile t3"></span><span class="hero-tile t4"></span><span class="hero-tile t5"></span><span class="hero-tile t6"></span><span class="hero-tile t7"></span><span class="hero-tile t8"></span></div>
        <div class="page-hero-inner">
            <h1 class="page-hero-title">Wish an app</h1>
        </div>
    </div>

    <main class="wish-wrap">

        <div class="alert alert-success" th:if="${success}">
            Thanks! Your wish has been sent. We'll contact you if we find a match.
        </div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form class="wish-form" method="post" th:action="@{/wish}" th:object="${wishForm}" autocomplete="off">

            <textarea class="wish-field" th:field="*{description}" maxlength="4000" required
                      placeholder="Please, describe the app you are looking for.&#10;Use as much details as you can…"></textarea>

            <input class="wish-field" type="text" th:field="*{budget}" maxlength="255"
                   placeholder="How much are you willing to pay for this app?"/>

            <input class="wish-field" type="email" th:field="*{email}" maxlength="255" required
                   placeholder="Your email (we will contact you only in this context)"/>

            <!-- honeypot -->
            <input class="hp" type="text" th:field="*{website}" tabindex="-1" autocomplete="off" aria-hidden="true"/>

            <div class="wish-submit-row">
                <button class="btn-wish-submit" type="submit">Wish an app</button>
            </div>
        </form>
    </main>

</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
