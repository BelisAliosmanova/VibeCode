<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{index :: favicons}"></th:block> <!-- TODO: point to the template that defines your favicons fragment, or delete this line -->
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Wish an app — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --white: #ffffff;
            --gray-200: #b0b8c4;
            --gray-300: #7a8494;
            --accent-green: rgba(143,230,4,1);
            --radius-xl: 16px;
            --radius-pill: 999px;
            --font: 'Sora', sans-serif;
        }
        * { font-family: 'Sora', sans-serif; }
        body { background:#233141; color:var(--white); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
        a { text-decoration:none; color:inherit; }

        /* ── HERO (identical to the Explore / homepage hero — only the heading text differs) ── */
        .hero {
            position: relative; height: 380px; overflow: hidden; background: #0d1520;
        }
        .hero-bg {
            position: absolute; inset: 0; z-index: 1;
            background-image: url(HOME-hero3.png);
            background-size: 50%; background-position: center right; background-repeat: no-repeat; opacity: 0.9;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(13,21,32,0.88) 0%, rgba(13,21,32,0.65) 35%, rgba(13,21,32,0.15) 65%, transparent 100%);
        }
        .hero-fade {
            position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, transparent, #1a2332); pointer-events: none;
        }
        .hero-inner {
            position: relative; height: 100%; max-width: 1100px; margin: 0 auto; padding: 0 2rem;
        }
        .hero-content {
            position: relative; height: 100%; display: flex; flex-direction: column;
            justify-content: center; padding-top: calc(var(--nav-h) + 0.5rem); max-width: 560px;
        }
        .hero-heading {
            font-size: 3rem; font-weight: 700; color: var(--white);
            line-height: 1.05; letter-spacing: 0.5px;
        }

        /* ── Form ── */
        .wish-wrap { max-width:620px; margin:0 auto; padding:3rem 1.5rem 6rem; }
        .wish-form { display:flex; flex-direction:column; gap:.85rem; }
        .wish-field {
            width:100%;
            background:#1a2332;
            border:1px solid rgba(255,255,255,.12);
            border-radius:14px;
            color:var(--white);
            font-family:var(--font);
            font-size:.8rem;
            padding:.85rem 1rem;
            outline:none;
            transition:border-color .12s, box-shadow .12s;
        }
        .wish-field::placeholder { color:rgba(255,255,255,.75); }
        .wish-field:focus { border-color:rgba(255,255,255,.4); box-shadow:0 0 0 3px rgba(255,255,255,.05); }
        textarea.wish-field { min-height:150px; resize:vertical; }
        .hp { position:absolute; left:-9999px; opacity:0; height:0; width:0; }

        .wish-submit-row { display:flex; justify-content:center; margin-top:1.2rem; }
        .btn-wish-submit {
            background:var(--accent-green);
            color:#000;
            border:none;
            border-radius:var(--radius-pill);
            font-size:.9rem;
            font-weight:800;
            text-transform:uppercase;
            padding:.7rem 2.6rem;
            cursor:pointer;
            transition:filter .12s, transform .12s;
        }
        .btn-wish-submit:hover { filter:brightness(1.08); transform:translateY(-1px); }

        .alert { border-radius:14px; padding:.85rem 1.1rem; font-size:.8rem; margin-bottom:1rem; }
        .alert-error   { background:rgba(255,75,114,.12); border:1px solid rgba(255,75,114,.6); }
        .alert-success { background:rgba(143,230,4,.1);  border:1px solid var(--accent-green); }

        @media (max-width: 768px) {
            .hero { height: 280px; }
            .hero-content { max-width: 100%; }
            .hero-heading { font-size: 2rem; }
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<!-- ── HERO (identical to Explore / homepage, only the heading text differs) ────── -->
<div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-fade"></div>
    <div class="hero-inner">
        <div class="hero-content">
            <h1 class="hero-heading">Wish an app</h1>
        </div>
    </div>
</div>

<main class="wish-wrap">

    <div class="alert alert-success" th:if="${success}">
        Thanks! Your wish has been sent. We'll contact you if we find a match.
    </div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form class="wish-form" method="post" th:action="@{/wish}" th:object="${wishForm}" autocomplete="off">

        <textarea class="wish-field" th:field="*{description}" maxlength="4000" required
                  placeholder="Please, describe the app you are looking for.&#10;Use as much details as you can…"></textarea>

        <input class="wish-field" type="text" th:field="*{budget}" maxlength="255"
               placeholder="How much are you willing to pay for this app?"/>

        <input class="wish-field" type="email" th:field="*{email}" maxlength="255" required
               placeholder="Your email (we will contact you only in this context)"/>

        <!-- honeypot -->
        <input class="hp" type="text" th:field="*{website}" tabindex="-1" autocomplete="off" aria-hidden="true"/>

        <div class="wish-submit-row">
            <button class="btn-wish-submit" type="submit">Wish an app</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
