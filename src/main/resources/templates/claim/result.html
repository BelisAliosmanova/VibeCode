<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verification — Vibe</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --dark: #5a5a5a; --black: #111; --white: #fff;
          --danger: #e05c5c; --success: #2d9e6b;
          --font: 'Inter', system-ui, sans-serif;
        }
        body { font-family: var(--font); background: var(--white); color: var(--black); }

        nav { display: flex; align-items: center; justify-content: space-between;
              padding: 0.85rem 2rem; background: var(--dark); }
        .nav-left { display: flex; align-items: center; gap: 1.5rem; }
        .nav-logo { width: 32px; height: 32px; background: #222; border-radius: 50%;
                    display: flex; align-items: center; justify-content: center;
                    color: white; font-weight: 800; font-size: 0.9rem; }
        .nav-link { color: #fff; text-decoration: none; font-size: 0.9rem; }

        .card-wrap {
          display: flex; align-items: center; justify-content: center;
          min-height: calc(100vh - 58px);
          padding: 2rem;
        }

        .card {
          max-width: 460px; width: 100%;
          border: 1.5px solid #e0e0e0; border-radius: 18px;
          padding: 2.5rem 2rem; text-align: center;
        }

        .icon {
          width: 64px; height: 64px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 1.8rem; margin: 0 auto 1.25rem;
        }
        .icon-error   { background: #fef2f2; }
        .icon-success { background: #f0fdf4; }

        h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.6rem; }
        p  { font-size: 0.88rem; color: #555; line-height: 1.6; margin-bottom: 1.5rem; }

        .btn {
          display: inline-block; background: var(--black); color: #fff;
          padding: 0.65rem 2rem; border-radius: 50px;
          text-decoration: none; font-size: 0.88rem; font-weight: 600;
        }
        .btn:hover { background: #333; }
        .btn-outline {
          display: inline-block; background: transparent;
          border: 1.5px solid #ddd; color: var(--black);
          padding: 0.65rem 2rem; border-radius: 50px;
          text-decoration: none; font-size: 0.88rem; font-weight: 500;
          margin-left: 0.5rem;
        }
        .btn-outline:hover { border-color: #aaa; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<nav>
    <div class="nav-left">
        <div class="nav-logo">V</div>
        <a class="nav-link" th:href="@{/explore}">Explore</a>
        <a class="nav-link" th:href="@{/submit}">Submit</a>
    </div>
</nav>

<div class="card-wrap">
    <div class="card">

        <!-- ── ERROR state ── -->
        <th:block th:if="${errorMessage != null}">
            <div class="icon icon-error">❌</div>
            <h1>Verification failed</h1>
            <p th:text="${errorMessage}">Something went wrong.</p>
            <a th:href="@{/explore}" class="btn-outline">Back to Explore</a>
        </th:block>

        <!-- ── SUCCESS state (fallback — normally redirected by controller) ── -->
        <th:block th:if="${errorMessage == null}">
            <div class="icon icon-success">✓</div>
            <h1>Ownership verified!</h1>
            <p>Your email has been confirmed and you now own this listing on Vibe.</p>
            <a th:href="@{/apps}" class="btn">View apps</a>
        </th:block>

    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
