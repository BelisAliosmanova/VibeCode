<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Submit Your App — Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #233141; --card-bg: #1e2a3a; --border: rgba(255,255,255,0.08);
            --white: #fff; --gray-200: #b0b8c4; --gray-300: #7a8494;
            --cyan: #00d4ff; --green: rgba(143,230,4,1); --radius-pill: 999px;
            --font: 'Sora', sans-serif;
        }
        body { font-family: var(--font); background: var(--bg); color: var(--white); }

        /* ── HERO — identical structure/sizing to the home page hero ──── */
        .hero { position: relative; height: 380px; overflow: hidden; background: #0d1520; }
        .hero-bg {
            position: absolute; inset: 0; z-index: 1;
            background-image: url(/HOME-hero3.png);
            background-size: 50%; background-position: center right; background-repeat: no-repeat; opacity: 0.9;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(13,21,32,0.88) 0%, rgba(13,21,32,0.65) 35%, rgba(13,21,32,0.15) 65%, transparent 100%);
        }
        .hero-fade {
            position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none;
        }
        .hero-inner { position: relative; height: 100%; max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
        .hero-content {
            position: relative; height: 100%; display: flex; flex-direction: column;
            justify-content: center; padding-top: calc(var(--nav-h) + 0.5rem); max-width: 560px;
        }
        .hero-heading { font-size: 3rem; font-weight: 700; color: var(--white); line-height: 1.05; letter-spacing: 0.5px; margin-bottom: 0.6rem; }
        .hero-subtext { font-size: 0.9rem; color: var(--gray-200); opacity: 0.85; }
        @media (max-width: 768px) {
            .hero { height: 280px; }
            .hero-heading { font-size: 2rem; }
        }

        .progress-bar { height: 3px; background: rgba(255,255,255,0.08); }
        .progress-fill { height: 100%; background: var(--cyan); }

        .page { max-width: 420px; margin: 2.5rem auto; padding: 0 1.5rem; text-align: center; }
        .page h2 { font-size: 0.95rem; font-weight: 600; color: var(--gray-200); margin-bottom: 1.5rem; letter-spacing: 0.02em; }

        .field { margin-bottom: 0.9rem; text-align: left; }
        .field input, .field textarea {
            width: 100%; padding: 0.7rem 1.2rem; border-radius: var(--radius-pill);
            border: 1.5px solid var(--border); background: var(--card-bg); color: var(--white);
            font-size: 0.86rem; font-family: var(--font); outline: none; transition: border-color 0.15s;
        }
        .field textarea { border-radius: 16px; resize: vertical; min-height: 110px; }
        .field input::placeholder, .field textarea::placeholder { color: var(--gray-300); }
        .field input:focus, .field textarea:focus { border-color: var(--cyan); }

        /* Icon upload */
        .icon-upload {
            width: 56px; height: 56px; border: 1.5px solid var(--border); border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; margin: 0 auto 1rem; background: var(--card-bg);
            transition: border-color 0.15s; position: relative; overflow: hidden;
        }
        .icon-upload:hover { border-color: var(--cyan); }
        .icon-upload .plus { font-size: 1.2rem; color: var(--cyan); line-height: 1; }
        .icon-upload input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .icon-preview { width: 100%; height: 100%; object-fit: cover; }

        .btn-update {
            margin-top: 1rem; background: var(--green); color: #15280a; border: none;
            padding: 0.7rem 2.5rem; border-radius: var(--radius-pill); font-size: 0.88rem;
            font-weight: 700; cursor: pointer; font-family: var(--font); transition: opacity 0.12s;
        }
        .btn-update:hover { opacity: 0.85; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-fade"></div>
    <div class="hero-inner">
        <div class="hero-content">
            <h1 class="hero-heading">Submit your app</h1>
            <p class="hero-subtext">Get visibility and pro feedback</p>
        </div>
    </div>
</div>

<div class="progress-bar"><div class="progress-fill" style="width:40%;"></div></div>

<div class="page">
    <h2>Main details</h2>

    <form th:action="@{/submit/details}" th:object="${app}" method="post" enctype="multipart/form-data">

        <div class="field">
            <input type="url" th:field="*{url}" placeholder="Your app URL from the previous page" required/>
        </div>
        <div class="field">
            <input type="url" th:field="*{githubUrl}" placeholder="GitHub repo URL (optional)"/>
        </div>

        <label class="icon-upload" id="iconLabel">
            <img id="iconPreview" class="icon-preview"
                 th:if="${app.iconUrl != null}" th:src="${app.iconUrl}" alt="icon"/>
            <span class="plus" id="iconPlus" th:style="${app.iconUrl != null} ? 'display:none' : ''">+</span>
            <input type="file" name="icon" accept="image/*" id="iconInput"/>
        </label>

        <div class="field">
            <input type="text" th:field="*{name}" placeholder="App name" required/>
        </div>

        <div class="field">
            <textarea th:field="*{description}" placeholder="App description"></textarea>
        </div>

        <div class="field">
            <input type="email" name="ownerEmail" placeholder="Your email" required/>
        </div>

        <button type="submit" class="btn-update">Update</button>
    </form>
</div>

<script>
    const input = document.getElementById('iconInput');
    const plus  = document.getElementById('iconPlus');
    const label = document.getElementById('iconLabel');
    input.addEventListener('change', (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            label.querySelector('.icon-preview')?.remove();
            const img = document.createElement('img');
            img.src = ev.target.result; img.className = 'icon-preview';
            label.prepend(img);
            if (plus) plus.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });
</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</html>
