<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${category.name} + ' — Submit App'">Step</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link th:replace="~{fragments/navbar :: navbar-css}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #233141; --card-bg: #1e2a3a; --border: rgba(255,255,255,0.08);
            --white: #fff; --gray-200: #b0b8c4; --gray-300: #7a8494;
            --cyan: #00d4ff; --green: rgba(143,230,4,1); --radius-pill: 999px;
            --font: 'Sora', sans-serif;
        }
        body { font-family: var(--font); background: var(--bg); color: var(--white); }

        /* ── HERO — identical structure/sizing to the home page hero ──── */
        .hero { position: relative; height: 380px; overflow: hidden; background: #0d1520; }
        .hero-bg {
            position: absolute; inset: 0; z-index: 1;
            background-image: url(/HOME-hero3.png);
            background-size: 50%; background-position: center right; background-repeat: no-repeat; opacity: 0.9;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(13,21,32,0.88) 0%, rgba(13,21,32,0.65) 35%, rgba(13,21,32,0.15) 65%, transparent 100%);
        }
        .hero-fade {
            position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none;
        }
        .hero-inner { position: relative; height: 100%; max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
        .hero-content {
            position: relative; height: 100%; display: flex; flex-direction: column;
            justify-content: center; padding-top: calc(var(--nav-h) + 0.5rem); max-width: 560px;
        }
        .hero-heading { font-size: 3rem; font-weight: 700; color: var(--white); line-height: 1.05; letter-spacing: 0.5px; margin-bottom: 0.6rem; }
        .hero-subtext { font-size: 0.9rem; color: var(--gray-200); opacity: 0.85; }
        @media (max-width: 768px) {
            .hero { height: 280px; }
            .hero-heading { font-size: 2rem; }
        }

        .progress-bar { height: 3px; background: rgba(255,255,255,0.08); }
        .progress-fill { height: 100%; background: var(--cyan); transition: width 0.3s; }

        .page { max-width: 480px; margin: 2.5rem auto; padding: 0 1.5rem; }

        /* App identity strip */
        .app-strip {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.7rem 0.9rem; border: 1px solid var(--border);
            border-radius: 12px; margin-bottom: 1.5rem; background: var(--card-bg);
        }
        .app-icon {
            width: 40px; height: 40px; border-radius: 10px; overflow: hidden;
            background: #16202c; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 1.1rem; color: var(--gray-300);
        }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        .app-info .app-name { font-size: 0.85rem; font-weight: 700; }
        .app-info .app-url { font-size: 0.7rem; color: var(--gray-300); }

        .page-title { font-size: 1.1rem; font-weight: 700; text-align: center; margin-bottom: 1rem; }

        .search-hint {
            text-align: center; font-size: 0.78rem; color: var(--gray-300);
            line-height: 1.5; margin-bottom: 1rem;
        }

        .section-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
        .search-wrap {
            display: flex; align-items: center;
            border: 1.5px solid var(--border); border-radius: var(--radius-pill);
            padding: 0.32rem 0.5rem 0.32rem 0.9rem; gap: 0.4rem; flex: 1; background: var(--card-bg);
        }
        .search-wrap input { border: none; outline: none; font-size: 0.8rem; font-family: var(--font); width: 50%; background: transparent; color: var(--white); }
        .search-wrap input::placeholder { color: var(--gray-300); }
        .search-clear { background: none; border: none; color: var(--gray-300); cursor: pointer; font-size: 0.85rem; padding: 0 2px; display: none; }
        .search-clear.show { display: inline-flex; }
        .divider-x { color: var(--gray-300); font-size: 0.8rem; }
        .custom-add-input { border: none; outline: none; font-size: 0.8rem; font-family: var(--font); background: transparent; color: var(--white); flex: 1; }
        .custom-add-input::placeholder { color: var(--gray-300); }

        .hint-row { display: flex; align-items: center; justify-content: space-between; margin: 0.6rem 0 0.9rem; }
        .info-text { font-size: 0.72rem; color: var(--gray-300); }
        .sort-select {
            font-size: 0.7rem; color: var(--gray-200); background: transparent;
            border: none; outline: none; font-family: var(--font); cursor: pointer;
        }
        .sort-select option { background: var(--card-bg); }

        .description { font-size: 0.78rem; color: var(--gray-300); margin-bottom: 1rem; line-height: 1.5; }

        .selected-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; min-height: 28px; }
        .options-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; }

        .pill {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.32rem 0.85rem; border-radius: 6px;
            font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
            cursor: pointer; user-select: none; transition: all 0.12s;
            background: rgb(0,0,0); color: var(--white); border: none;
        }
        .pill:hover { background: rgba(0,0,0,0.6); }
        .pill.selected { color: var(--green); }
        .pill.selected img { filter: brightness(0) saturate(100%) invert(85%) sepia(60%) saturate(900%) hue-rotate(50deg); }
        .pill-icon { width: 14px; height: 14px; object-fit: contain; border-radius: 3px; flex-shrink: 0; }
        .pill-count { color: var(--gray-200); font-weight: 500; text-transform: none; letter-spacing: normal; }

        /* Custom (user-added) entry pills — selectable like normal pills, and editable */
        .pill.custom-pill { position: relative; }
        .pill.custom-pill .pill-label { cursor: text; }
        .pill.editing { cursor: default; background: rgba(0,0,0,0.7); }
        .pill-edit-input {
            border: none; outline: none; background: transparent;
            font-family: var(--font); font-size: 0.68rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.04em; color: var(--white);
            min-width: 40px;
        }

        .actions { display: flex; align-items: center; gap: 1rem; }
        .btn-black {
            background: var(--green); color: #15280a; border: none;
            padding: 0.65rem 2.2rem; border-radius: var(--radius-pill);
            font-size: 0.86rem; font-weight: 700; cursor: pointer; font-family: var(--font);
            transition: opacity 0.12s;
        }
        .btn-black:hover { opacity: 0.85; }
        .btn-skip {
            background: transparent; border: none; color: var(--gray-300);
            font-size: 0.8rem; cursor: pointer; text-decoration: underline; font-family: var(--font);
        }
        .btn-skip:hover { color: var(--white); }
    </style>
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-fade"></div>
    <div class="hero-inner">
        <div class="hero-content">
            <h1 class="hero-heading">Submit your app</h1>
            <p class="hero-subtext">Get visibility and pro feedback</p>
        </div>
    </div>
</div>

<div class="progress-bar">
    <div class="progress-fill"
         th:style="'width: ' + (${stepNumber} * 100 / ${totalSteps}) + '%'"></div>
</div>

<form th:action="@{/submit/step}" method="post" id="stepForm">
    <input type="hidden" th:name="appId" th:value="${app.id}"/>
    <input type="hidden" th:name="categoryId" th:value="${category.id}"/>
    <input type="hidden" th:name="nextCategoryId"
           th:value="${nextCategory != null ? nextCategory.id : null}" id="nextCategoryId"/>
    <div id="entryInputs"></div>

    <div class="page">

        <div class="app-strip">
            <div class="app-icon">
                <img th:if="${app.iconUrl != null}" th:src="${app.iconUrl}" alt="icon"/>
                <span th:if="${app.iconUrl == null}">🖼</span>
            </div>
            <div class="app-info">
                <div class="app-name" th:text="${app.name}">App Name</div>
                <div class="app-url" th:text="${app.url}">https://...</div>
            </div>
        </div>

        <div class="page-title" th:text="${category.name}">Tag your app</div>

        <p class="search-hint">
            Search or create custom features to match your app’s functionality.
        </p>

        <div class="section-header">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search..."/>
                <button type="button" class="search-clear" id="searchClear">✕</button>
                <span class="divider-x">|</span>
                <input type="text" id="customInput" class="custom-add-input" placeholder="Add custom"/>
            </div>
        </div>

        <p class="description"
           th:if="${category.description != null and !category.description.isEmpty()}"
           th:text="${category.description}"></p>

        <div class="hint-row">
            <span class="info-text" id="infoText">Click below to add (max <span th:text="${category.maxSelected}">4</span>)</span>
            <select class="sort-select" id="sortSelect">
                <option value="popular">Sort by: Most popular</option>
                <option value="az">Sort by: A–Z</option>
            </select>
        </div>

        <div class="selected-pills" id="selectedPills"></div>

        <div class="options-pills" id="optionPills">
            <span th:each="entry : ${entries}"
                  class="pill"
                  th:data-id="${entry.id}"
                  th:data-name="${entry.name}"
                  th:data-count="${entryAppCounts.get(entry.id) != null ? entryAppCounts.get(entry.id) : 0}"
                  th:data-description="${entry.description}"
                  th:title="${entry.description}"
                  th:classappend="${#lists.contains(selectedIds, entry.id)} ? ' selected' : ''">
                <img th:if="${entry.iconUrl != null}"
                     th:src="${entry.iconUrl}" th:alt="${entry.name}" class="pill-icon"/>
                <span class="pill-label" th:text="${entry.name}">Entry</span>
                <span class="pill-count"
                      th:if="${entryAppCounts.get(entry.id) != null and entryAppCounts.get(entry.id) > 0}"
                      th:text="'(' + ${entryAppCounts.get(entry.id)} + ')'"></span>
            </span>
        </div>

        <div class="actions">
            <button type="submit" class="btn-black"
                    th:text="${isLastStep} ? 'Submit App' : 'Update'">Update</button>
            <button type="button" class="btn-skip" onclick="skipStep()">Skip</button>
        </div>
    </div>
</form>

<script th:inline="javascript">
    const MAX = /*[[${category.maxSelected}]]*/ null;
    const IS_SINGLE = MAX === 1;

    let selected = new Map(
        [...document.querySelectorAll('.pill.selected')]
            .map(p => [p.dataset.id, p.dataset.name])
    );

    document.querySelectorAll('#optionPills .pill').forEach(pill => {
        pill.addEventListener('click', () => toggle(pill));
    });

    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const q = this.value.toLowerCase();
            searchClear.classList.toggle('show', this.value.length > 0);
            document.querySelectorAll('#optionPills .pill').forEach(p => {
                p.style.display = p.dataset.name.toLowerCase().includes(q) ? '' : 'none';
            });
        });
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });
    }

    function sortPills(mode) {
        const container = document.getElementById('optionPills');
        const pills = [...container.children].filter(p => p.dataset.id); // skip any non-pill nodes
        if (mode === 'az') {
            pills.sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));
        } else {
            // Most popular = real linked-app count from the backend (data-count),
            // not client-side "selected first" — ties break alphabetically.
            pills.sort((a, b) => {
                const diff = (parseInt(b.dataset.count) || 0) - (parseInt(a.dataset.count) || 0);
                return diff !== 0 ? diff : a.dataset.name.localeCompare(b.dataset.name);
            });
        }
        pills.forEach(p => container.appendChild(p));
    }

    const sortSelect = document.getElementById('sortSelect');
    if (sortSelect) {
        sortSelect.addEventListener('change', function () { sortPills(this.value); });
    }
    sortPills('popular'); // default order on load

    // ── Custom entry: add-then-select flow ──────────────────────────────
    // Typing a name and hitting Enter just drops a new (unselected) pill into
    // the options list — same as any catalog entry. The user then clicks it
    // to select it, subject to the same MAX / single-select rules as everything
    // else, since it goes through the same toggle() function.
    const customInput = document.getElementById('customInput');
    if (customInput) {
        customInput.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const name = this.value.trim();
            if (!name) return;
            const id = 'custom-' + Date.now();
            createCustomPill(id, name);
            this.value = '';
        });
    }

    function createCustomPill(id, name) {
        const pill = document.createElement('span');
        pill.className = 'pill custom-pill';
        pill.dataset.id = id;
        pill.dataset.name = name;
        pill.dataset.count = '0';
        pill.title = 'Click to select · double-click to edit';

        const label = document.createElement('span');
        label.className = 'pill-label';
        label.textContent = name;
        pill.appendChild(label);

        pill.addEventListener('click', () => {
            if (pill.classList.contains('editing')) return;
            toggle(pill);
        });

        label.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            startEditing(pill);
        });

        document.getElementById('optionPills').appendChild(pill);
        return pill;
    }

    // ── Inline rename for custom pills (fixes typos before or after selecting) ──
    function startEditing(pill) {
        if (pill.classList.contains('editing')) return;
        pill.classList.add('editing');
        const oldLabel = pill.querySelector('.pill-label');
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'pill-edit-input';
        input.value = pill.dataset.name;
        pill.replaceChild(input, oldLabel);
        input.focus();
        input.select();

        function commit() {
            const newName = input.value.trim() || pill.dataset.name;
            pill.dataset.name = newName;

            const newLabel = document.createElement('span');
            newLabel.className = 'pill-label';
            newLabel.textContent = newName;
            newLabel.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                startEditing(pill);
            });
            pill.replaceChild(newLabel, input);
            pill.classList.remove('editing');

            // Keep the selected-pill row and hidden form inputs in sync
            // if this custom entry is currently selected.
            if (selected.has(pill.dataset.id)) {
                selected.set(pill.dataset.id, newName);
                render();
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { e.preventDefault(); input.value = pill.dataset.name; input.blur(); }
        });
        input.addEventListener('blur', commit);
    }

    function toggle(pill) {
        const id = pill.dataset.id, name = pill.dataset.name;
        if (selected.has(id)) {
            selected.delete(id);
            pill.classList.remove('selected');
        } else {
            if (IS_SINGLE) {
                selected.clear();
                document.querySelectorAll('#optionPills .pill.selected')
                    .forEach(p => p.classList.remove('selected'));
            }
            if (MAX && selected.size >= MAX) return;
            selected.set(id, name);
            pill.classList.add('selected');
        }
        render();
    }

    function render() {
        const sp = document.getElementById('selectedPills');
        sp.innerHTML = '';
        selected.forEach((name, id) => {
            const pill = document.createElement('span');
            pill.className = 'pill selected';
            pill.textContent = name + ' ✕';
            pill.addEventListener('click', () => {
                selected.delete(id);
                const opt = document.querySelector(`#optionPills .pill[data-id="${id}"]`);
                if (opt) opt.classList.remove('selected');
                render();
            });
            sp.appendChild(pill);
        });

        const info = document.getElementById('infoText');
        if (MAX) {
            const left = MAX - selected.size;
            info.textContent = IS_SINGLE
                ? (selected.size === 1 ? 'Selected' : 'Choose one')
                : `Click below to add (max ${MAX})`;
        } else {
            info.textContent = `${selected.size} selected`;
        }

        const container = document.getElementById('entryInputs');
        container.innerHTML = '';
        selected.forEach((name, id) => {
            const inp = document.createElement('input');
            inp.type = 'hidden';
            inp.name = id.startsWith('custom-') ? 'customEntries' : 'entryIds';
            inp.value = id.startsWith('custom-') ? name : id;
            container.appendChild(inp);
        });
    }

    function skipStep() {
        selected.clear();
        document.querySelectorAll('#optionPills .pill').forEach(p => p.classList.remove('selected'));
        render();
        document.getElementById('stepForm').submit();
    }

    render();
</script>

</body>
</html>
